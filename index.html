<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellar Seat Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");
      body {
        font-family: "Outfit", sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
    </style>
  </head>
  <body
    class="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 gap-6"
  >
    <div id="testing-panel" class="max-w-7xl w-full bg-slate-800/60 backdrop-blur-xl border border-slate-700/50 p-6 rounded-3xl shadow-2xl flex flex-col md:flex-row gap-6 items-center justify-between">
      <div class="flex flex-col gap-2 w-full md:w-1/2 border-r border-slate-700/30 pr-0 md:pr-4">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-xs font-bold uppercase tracking-wider text-cyan-400">1. Quick Registration</span>
        </div>
        <div class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="reg-name" placeholder="Name" class="bg-slate-950 border border-slate-700/60 px-3 py-2 rounded-xl text-xs w-full text-slate-200 focus:outline-none focus:border-cyan-500">
          <input type="email" id="reg-email" placeholder="Email" class="bg-slate-950 border border-slate-700/60 px-3 py-2 rounded-xl text-xs w-full text-slate-200 focus:outline-none focus:border-cyan-500">
          <input type="password" id="reg-pass" placeholder="Password" class="bg-slate-950 border border-slate-700/60 px-3 py-2 rounded-xl text-xs w-full text-slate-200 focus:outline-none focus:border-cyan-500">
        </div>
        <button onclick="triggerRegister()" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-xs font-bold py-2 rounded-xl hover:opacity-90 active:scale-95 transition-all mt-1 shadow-lg shadow-cyan-500/20">Create Account</button>
      </div>

      <div class="flex flex-col gap-2 w-full md:w-1/2 pl-0 md:pl-4">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">2. Quick Login</span>
          <div class="flex items-center gap-2 bg-slate-950/40 px-3 py-1 rounded-full border border-slate-700/40">
            <div id="auth-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></div>
            <span id="auth-text" class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">Guest Mode</span>
          </div>
        </div>
        <div class="flex flex-col sm:flex-row gap-2">
          <input type="email" id="login-email" placeholder="Email" class="bg-slate-950 border border-slate-700/60 px-3 py-2 rounded-xl text-xs w-full text-slate-200 focus:outline-none focus:border-emerald-500">
          <input type="password" id="login-pass" placeholder="Password" class="bg-slate-950 border border-slate-700/60 px-3 py-2 rounded-xl text-xs w-full text-slate-200 focus:outline-none focus:border-emerald-500">
        </div>
        <button onclick="triggerLogin()" class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white text-xs font-bold py-2 rounded-xl hover:opacity-90 active:scale-95 transition-all mt-1 shadow-lg shadow-emerald-500/20">Sign In & Inject Token</button>
      </div>
    </div>

    <div
      class="max-w-7xl w-full bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-slate-700/50"
    >
      <div class="text-center mb-10">
        <h1
          class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 mb-4 tracking-tight"
        >
          ChaiCode Cinema - Now Showing<br />
          <br />
          <span class="text-red-400">
            <span class="font-bold">Dhurandhar The Revenge</span>
          </span>
        </h1>
        <p class="text-slate-400 text-lg">Jassi ko ghar ki yaad kyu nhi aai?</p>
      </div>

      <div class="flex justify-center mb-10">
        <div
          class="bg-slate-900/50 rounded-full px-6 py-3 border border-slate-700 flex gap-8 items-center"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-4 h-4 rounded-full bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.6)]"
            ></div>
            <span class="text-slate-300 font-medium tracking-wide"
              >Available</span
            >
          </div>
          <div class="w-px h-6 bg-slate-700"></div>
          <div class="flex items-center gap-3">
            <div
              class="w-4 h-4 rounded-full bg-rose-500/20 border border-rose-500/50"
            ></div>
            <span class="text-slate-400 font-medium tracking-wide">Booked</span>
          </div>
        </div>
      </div>

      <div class="flex justify-center">
        <div
          class="bg-slate-900/40 p-8 rounded-2xl border border-slate-700/50 shadow-inner overflow-x-auto w-full"
        >
          <table
            id="tbl"
            class="border-separate border-spacing-4 mx-auto"
          ></table>
        </div>
      </div>
    </div>

    <script>
      const API_URL = window.location.origin;
      let currentToken = localStorage.getItem("auth_token") || "";

      // Sync Token UI States
      function updateAuthUI() {
        const authDot = document.getElementById('auth-dot');
        const authText = document.getElementById('auth-text');
        
        if (currentToken) {
          authDot.className = "w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]";
          authText.innerText = "Token Active";
          authText.className = "text-[10px] font-bold text-cyan-400 uppercase tracking-wide";
        } else {
          authDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
          authText.innerText = "Guest Mode";
          authText.className = "text-[10px] font-bold text-slate-400 uppercase tracking-wide";
        }
      }

      // Action Handler: Register
      async function triggerRegister() {
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-pass').value.trim();

        if (!name || !email || !password) return alert("All fields are required for registration!");

        try {
          const res = await fetch(`${API_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
          });
          const data = await res.json();
          alert(data.message || "Registration completed!");
        } catch (err) {
          alert("Registration process error.");
        }
      }

      // Action Handler: Login
      async function triggerLogin() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-pass').value.trim();

        if (!email || !password) return alert("Email and Password fields are required!");

        try {
          const res = await fetch(`${API_URL}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          
          if (res.ok && data.token) {
            currentToken = data.token;
            localStorage.setItem("auth_token", data.token); // Secure token extraction storage
            updateAuthUI();
            alert("Logged in successfully! Token injected.");
            run(); // Refresh seats grid instantly
          } else {
            alert("Login failed: " + (data.message || "Invalid credentials"));
          }
        } catch (err) {
          alert("Failed connecting to authorization server.");
        }
      }

      // Fetch and Render Rows Function (Sir's core structure intact)
      async function run() {
        const tbl = document.getElementById("tbl");
        const res = await fetch("/seats");
        const resarray = await res.json();
        const j = resarray.sort((a, b) => a.id - b.id);
        tbl.innerHTML = ""; // Clear loader matrix rows

        let tr;
        for (let i = 0; i < j.length; i++) {
          if (i % 8 === 0) tr = document.createElement("tr");

          const td = document.createElement("td");
          const baseClasses =
            "w-32 h-32 rounded-2xl text-center align-middle text-2xl font-bold transition-all duration-300 select-none relative group";

          if (j[i].isbooked) {
            td.className = `${baseClasses} bg-rose-500/10 text-rose-500/60 border border-rose-500/20 cursor-not-allowed`;
            td.innerHTML = `
                <span class="relative z-10">${j[i].id}</span>
                <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-4 py-2 bg-slate-900 border border-slate-700 text-sm text-slate-300 rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap shadow-2xl z-50 pointer-events-none font-normal shadow-[0_10px_25px_rgba(0,0,0,0.5)]">
                    Booked by: <span class="font-bold text-white ml-1">${j[i].name || "Verified User"}</span>
                    <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[1px] border-[6px] border-transparent border-t-slate-700"></div>
                    <div class="absolute top-full left-1/2 -translate-x-1/2 -mt-[2px] border-[5px] border-transparent border-t-slate-900"></div>
                </div>
            `;
          } else {
            td.className = `${baseClasses} bg-emerald-500 text-white border-2 border-emerald-400 shadow-[0_0_20px_rgba(16,185,129,0.3)] cursor-pointer hover:bg-emerald-400 hover:-translate-y-1.5 hover:shadow-[0_10px_25px_rgba(16,185,129,0.5)] active:scale-95 active:shadow-[0_0_10px_rgba(16,185,129,0.3)]`;
            td.innerHTML = `<span class="relative z-10">${j[i].id}</span>`;
          }

          // Booking Event Trigger Listener
          td.addEventListener("click", async function (e) {
            const currentTd = e.currentTarget;
            if (currentTd.classList.contains("cursor-not-allowed")) {
              return; // Guard statement to protect locked slots
            }

            if (!currentToken) {
              alert("Access Denied: Please register/login using the testing panel at the top first!");
              return;
            }

            try {
              const id = j[i].id;

              // Safe PUT request routed through secure header pipeline mapping
              const response = await fetch(`${API_URL}/${id}`, { 
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${currentToken}`
                }
              });
              
              const data = await response.json();

              if (!response.ok || data.error) {
                alert("FAILED! " + (data.message || data.error || "Transaction aborted."));
              } else {
                alert("Booked successfully!");
                run(); // Re-fetch matrix block for dynamic validation status
              }
            } catch (ex) {
              alert("Error booking seat: " + ex.message);
            }
          });

          tr.appendChild(td);
          if (i % 8 === 7 || i === j.length - 1) {
            tbl.appendChild(tr);
          }
        }
        updateAuthUI();
      }

      // Initial system startup pipeline triggers
      run();
    </script>
  </body>
</html>
