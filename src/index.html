<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChaiCode Cinema</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

<!-- 🔐 TOP BAR -->
<div class="flex justify-between items-center p-4 bg-slate-900">
  <h1 class="text-xl font-bold text-emerald-400">ChaiCode Cinema</h1>

  <div>
    <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded">Logout</button>
  </div>
</div>

<!-- 🔐 LOGIN -->
<div class="p-4 bg-slate-800">
  <input id="email" placeholder="email" class="p-2 text-black">
  <input id="password" type="password" placeholder="password" class="p-2 text-black">
  <button onclick="login()" class="bg-green-500 px-4 py-2 ml-2 rounded">Login</button>
</div>

<!-- 🎬 MOVIES -->
<h2 class="text-2xl p-4">Now Showing</h2>

<div id="movies" class="grid grid-cols-3 gap-4 p-4"></div>

<!-- 🎟️ SEATS -->
<h2 class="text-2xl p-4">Select Your Seat</h2>
<div id="seats" class="grid grid-cols-10 gap-2 p-4"></div>

<script>
const API = "http://localhost:8080";
let token = localStorage.getItem("token") || "";

/* ---------------- LOGIN ---------------- */
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const res = await fetch(`${API}/login`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (data.token) {
    token = data.token;
    localStorage.setItem("token", token);
    alert("Login success");
  } else {
    alert("Login failed");
  }
}

/* ---------------- LOGOUT ---------------- */
function logout() {
  localStorage.removeItem("token");
  token = "";
  alert("Logged out");
}

/* ---------------- MOVIES ---------------- */
const movies = [
  { id: 1, title: "Dhurandhar", img: "https://picsum.photos/300/400?1" },
  { id: 2, title: "Chai Love Story", img: "https://picsum.photos/300/400?2" },
  { id: 3, title: "Code Warriors", img: "https://picsum.photos/300/400?3" }
];

function loadMovies() {
  const box = document.getElementById("movies");

  movies.forEach(m => {
    const div = document.createElement("div");

    div.className = "bg-slate-900 rounded-xl overflow-hidden shadow-lg hover:scale-105 transition";

    div.innerHTML = `
      <img src="${m.img}" class="w-full h-64 object-cover">
      <div class="p-3">
        <h3 class="text-lg font-bold">${m.title}</h3>
        <button onclick="loadSeats()" 
          class="mt-2 bg-emerald-500 px-3 py-1 rounded">
          Book Now
        </button>
      </div>
    `;

    box.appendChild(div);
  });
}

/* ---------------- SEATS (CINEMA STYLE) ---------------- */
async function loadSeats() {
  const res = await fetch(`${API}/seats`);
  const data = await res.json();

  const box = document.getElementById("seats");
  box.innerHTML = "";

  data.forEach((seat, i) => {
    const div = document.createElement("div");

    div.className = seat.isbooked
      ? "bg-red-600 p-2 text-center rounded"
      : "bg-green-500 p-2 text-center rounded cursor-pointer hover:bg-green-400";

    div.innerText = seat.id;

    div.onclick = async () => {
      if (seat.isbooked) return;

      if (!token) {
        alert("Please login first");
        return;
      }

      const res = await fetch(`${API}/${seat.id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        }
      });

      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Booking failed");
      } else {
        alert("Seat booked!");
        loadSeats();
      }
    };

    box.appendChild(div);
  });
}

/* INIT */
loadMovies();
loadSeats();

</script>
</body>
</html>
